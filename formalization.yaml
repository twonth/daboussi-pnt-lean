        The user requested the full manuscript argument, a readable comparator
        challenge and this metadata file, explicitly prohibiting a different PNT proof.
  notes: "No subagents, PNT oracle, native_decide, added axioms, or proof substitution."
fidelity:
  divergences: >-
    The main statement uses convergence instead of little-o. Smoothness uses
    prime-divisor bounds and prime-power sums use restricted von Mangoldt.
    Dirichlet convolution gives the smooth/rough identity. Smooth positive mass
    is computed directly by Tonelli and the Euler product, replacing the
    intermediate partial summation and polylogarithmic growth argument for Psi.
    Primorial support makes the integrated prime-power sum finite before bounding
    its coefficient by a geometric series. The centered moment and three ranges
    are combined into an indicator-function majorant, with exp((1+epsilon) log y)
    as split point. The below-cutoff proof absorbs a/t into epsilon/2 by enlarging T.
    General scalar/filter and geometric-block lemmas organize the limits. These
    are technical reorganizations of the supplied proof, not a different PNT proof.
review:
  status: "self-assessed"
  reviewers: ["OpenAI Codex"]
  notes: >-
    Local compiler checks and transitive axiom inspection cover all supporting
    modules and the main theorem; see Verification and Audit.lean. The bundled
    comparator accepted the exported solution, including statement comparison,
    axiom checking, and kernel replay (exit code 0). Windows requires
    its no-sandbox mode, so this is not an isolated adversarial build check.
    No independent peer review or author endorsement is claimed.
